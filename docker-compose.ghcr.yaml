services:
  registry:
    image: 'registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373'
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - 'registry-data:/var/lib/registry'
      - 'registry-auth:/etc/docker/registry'
    environment:
      REGISTRY_HTTP_SECRET: '${SERVICE_BASE64_REGISTRY:-nexus-registry-secret}'

  openclaw:
    # Simple channel/tag-based deployment that matches npm dist-tags.
    # Defaults to `latest`, but always pulls so mutable tags do not reuse stale local images.
    image: 'ghcr.io/marcoby-dev-ops/openclaw-coolify:${OPENCLAW_TAG:-latest}'
    pull_policy: always
    restart: unless-stopped
    networks:
      - coolify
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    env_file:
      - .env
    environment:
      DOCKER_HOST: 'tcp://docker-proxy:2375'
      OPENCLAW_ENABLE_WEBHOOK_PROXY: '1'
      PORT: 18790
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=4096'
      HOME: /data
      OPENCLAW_GATEWAY_TOKEN: '${OPENCLAW_GATEWAY_TOKEN:-sk-openclaw-local}'
      OPENCLAW_AGENTS_DEFAULTS_MODEL_FALLBACKS: '${OPENCLAW_AGENTS_DEFAULTS_MODEL_FALLBACKS}'
      OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY: '${OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY}'
      OPENCLAW_AGENTS_DEFAULTS_SANDBOX_WORKSPACEACCESS: '${OPENCLAW_AGENTS_DEFAULTS_SANDBOX_WORKSPACEACCESS:-rw}'
      OPENCLAW_NEXUS_AGENT_SANDBOX_MODE: '${OPENCLAW_NEXUS_AGENT_SANDBOX_MODE:-non-main}'
      OPENCLAW_AGENTS_DEFAULTS_SANDBOX_DOCKER_NETWORK: '${OPENCLAW_AGENTS_DEFAULTS_SANDBOX_DOCKER_NETWORK:-bridge}'
      OPENCLAW_GATEWAY_BIND: '${OPENCLAW_GATEWAY_BIND:-lan}'
      OPENCLAW_GATEWAY_RELOAD_MODE: '${OPENCLAW_GATEWAY_RELOAD_MODE:-hot}'
      OPENCLAW_GATEWAY_PORT: '${OPENCLAW_GATEWAY_PORT:-18790}'
      OPENCLAW_STATE_DIR: /data/.openclaw
      OPENCLAW_WORKSPACE: /data/workspace/main
      WORKSPACE_DIR: /data/workspace
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY}'
      GEMINI_API_KEY: '${GEMINI_API_KEY}'
      SANDBOX_CONTAINER: '${SANDBOX_CONTAINER:-false}'
      BASE_URL: 'https://${SERVICE_FQDN_OPENCLAW}'
      PUBLIC_URL: 'https://${SERVICE_FQDN_OPENCLAW}'
      OPENCLAW_AUTO_BOOTSTRAP: '1'
      CHOKIDAR_USEPOLLING: 'true'
      OPENCLAW_BETA: '${OPENCLAW_BETA:-false}'
    volumes:
      - 'openclaw-data:/data'
      - '${SHARED_WORKSPACE_DIR:-/data/nexus/workspace}:/data/workspace'
    depends_on:
      docker-proxy:
        condition: service_healthy
    command:
      - bash
      - /app/scripts/bootstrap.sh
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "18790" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  docker-proxy:
    image: 'tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476'
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - POST=1
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - INFO=1
      - VERSION=1
      - EXEC=1
      - EVENTS=1
      - BUILD=1
      - PULL=1
      - TIMEOUT_CONNECT=5000
      - TIMEOUT_CLIENT=120000
      - TIMEOUT_SERVER=120000
      - TIMEOUT_TUNNEL=120000
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2375" ]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    build:
      context: .
      dockerfile: searxng/Dockerfile
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - 'searxng-data:/var/lib/searxng'
    environment:
      SEARXNG_BASE_URL: 'http://searxng:8080'
      SEARXNG_SERVER_SECRET_KEY: '${SERVICE_BASE64_SEARXNG:-searxng-secret}'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

networks:
  coolify:
    external: true

volumes:
  openclaw-data:
  searxng-data:
  registry-data:
  registry-auth:
